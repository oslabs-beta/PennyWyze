name: CI

on:
  pull_request:
  push:
    # Both, because a PR is only tested against a predicted merge. Two PRs
    # approved separately are each tested without the other, so the combined
    # state that actually lands is verified here and nowhere else.
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
